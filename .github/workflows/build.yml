name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # runner 自带 Android SDK，直接用它的 sdkmanager。
      # 不要用 android-actions/setup-android：它会去装早已下架的 legacy `tools` 包然后失败，
      # 而且 runner 上 sdkmanager 并没有在 PATH 里，得自己找。
      - name: Install SDK components
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n1)
          echo "SDK=$SDK"
          echo "sdkmanager=$SDKMANAGER"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.2" "build-tools;37.0.0"
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
          } >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        run: |
          KEYSTORE="$RUNNER_TEMP/release.jks"
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE"
            {
              echo "SIGNING_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}"
              echo "SIGNING_KEY_ALIAS=${{ secrets.KEY_ALIAS }}"
              echo "SIGNING_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
            } >> "$GITHUB_ENV"
          else
            # 没有配置 secret 时现场生成。注意：每次构建签名都不同，
            # 用户覆盖安装必须先卸载。要固定签名请设置 KEYSTORE_BASE64。
            keytool -genkeypair -v -keystore "$KEYSTORE" \
              -alias douyin-unlimit -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=DouyinUnlimit, OU=Dev, O=DouyinUnlimit, C=CN"
            {
              echo "SIGNING_STORE_PASSWORD=android"
              echo "SIGNING_KEY_ALIAS=douyin-unlimit"
              echo "SIGNING_KEY_PASSWORD=android"
            } >> "$GITHUB_ENV"
          fi
          echo "SIGNING_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build release
        run: ./gradlew :app:assembleRelease --stacktrace

      # 让产物（以及 Release 附件）带上版本名，而不是千篇一律的 app-release.apk。
      # tag 构建时 GITHUB_REF_NAME 是 tag 名（v1.0），分支构建时是分支名。
      - name: Rename APK
        run: |
          cd app/build/outputs/apk/release
          for f in *.apk; do
            [ "$f" = "douyin-unlimit-${GITHUB_REF_NAME}.apk" ] && continue
            mv "$f" "douyin-unlimit-${GITHUB_REF_NAME}.apk"
          done
          ls -l

      - name: Verify APK
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          echo "APK: $APK"
          echo "--- 体积 ---"
          ls -l "$APK" | awk '{printf "apk total: %.2f MB\n", $5/1048576}'
          unzip -l "$APK" | grep -E "classes.*\.dex" | awk '{printf "%-20s %.2f MB\n", $4, $1/1048576}'
          echo "--- xposed 元数据 ---"
          unzip -l "$APK" | grep -E 'META-INF/xposed/' || (echo "缺少 xposed 元数据！" && exit 1)
          echo "--- 入口类与清单 ---"
          unzip -p "$APK" META-INF/xposed/java_init.list
          echo "--- 签名 ---"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: douyin-unlimit
          path: app/build/outputs/apk/release/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          body: |
            LSPosed 模块：**让抖音看起来没有被限制**。
            只改客户端本地的显示与交互，不碰服务端状态，也不修改账号本身。

            ### 四个开关
            - **别提示我被限制了**（默认开）—— 干掉弹窗吐司、消息页顶部横幅、聊天里的红叹号，以及服务端下发的限制文案
            - **关键词拦截**（默认关）—— 拦截含有关键词的吐司或者文案
            - **假装点赞成功了**（默认开）—— 点击和双击都按原生走，只在服务端驳回、抖音要撤销点赞的那一刻把它按住
            - **记录详细日志**（默认关）—— 关闭时一行日志都不写

            ### 安装
            1. **先卸载旧版**（CI 每次现场生成签名，覆盖安装会失败）
            2. 安装 APK，在 LSPosed 里启用模块，作用域勾选「抖音」
            3. 强制停止抖音后重新打开

            ### 说明
            目标是抖音 `40.2.0`。定位尽量按「形状」而不是写死名字，其它版本大概率也能用；
            失效时打开「记录详细日志」，日志会写明哪个目标没找到。
            点赞是本地呈现——服务端其实没有接受，下拉刷新后会恢复。
